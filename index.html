<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACN - Home</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #ffffff 0%, #cccccc 100%) no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Montserrat', sans-serif;
        color: #444;
        overflow: hidden;
        min-height: 100vh;
      }

      .container {
        text-align: center;
        max-width: 600px;
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      span {
        font-family: monospace;
        font-size: 1.5em;
        font-weight: normal;
      }

      span:after {
        content: "_";
        opacity: 0;
        animation: cursor 1s infinite;
      }

      @keyframes cursor {
        0%, 40% { opacity: 0; }
        50%, 90% { opacity: 1; }
        100% { opacity: 0; }
      }

      a {
        color: #444;
        text-decoration: none;
        border-bottom: 1px dotted #aaa;
      }

      a:hover {
        color: #000;
        border-bottom: 1px solid #444;
      }

      footer {
        margin-top: 40px;
        font-size: 0.85em;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span>This website is currently under construction</span>
      <p>
        For further information, contact us at
        <a href="mailto:webmaster@acn.gr">webmaster@acn.gr</a>
      </p>
    </div>
  </body>
</html>
